name: Windows x64 v0.2

on:
  push:
    branches:
      - feature/windows-x64-sdl3-v0.2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PACKAGE_NAME: Diablo Reincarnated v0.2
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find vcpkg toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @($env:VCPKG_INSTALLATION_ROOT, $env:VCPKG_ROOT, 'C:\vcpkg') |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'scripts\buildsystems\vcpkg.cmake')) }
          if ($roots.Count -eq 0) {
            throw 'GitHub runner vcpkg installation not found.'
          }
          $toolchain = Join-Path $roots[0] 'scripts\buildsystems\vcpkg.cmake'
          "VCPKG_TOOLCHAIN=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using vcpkg toolchain at $toolchain"

      - name: Configure Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-win64 -G 'Visual Studio 17 2022' -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_TOOLCHAIN" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>' `
            -DUSE_SDL3=ON `
            -DDEVILUTIONX_SYSTEM_SDL3=OFF `
            -DDEVILUTIONX_STATIC_SDL3=ON `
            -DDEVILUTIONX_SYSTEM_SDL_IMAGE=OFF `
            -DDEVILUTIONX_STATIC_SDL_IMAGE=ON `
            -DDEVILUTIONX_SYSTEM_SDL_MIXER=OFF `
            -DDEVILUTIONX_STATIC_SDL_MIXER=ON `
            -DBUILD_TESTING=OFF `
            -DDISABLE_ZERO_TIER=ON `
            -DBUILD_ASSETS_MPQ=OFF `
            -DDISABLE_LTO=ON
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 configure failed' }

      - name: Build game
        shell: pwsh
        run: |
          cmake --build build-win64 --config Release --target devilutionx --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 compilation failed' }

      - name: Build and run renderer tests
        shell: pwsh
        run: |
          cmake -S Source/reincarnated -B build-renderer-tests -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Test configure failed' }
          cmake --build build-renderer-tests --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Test build failed' }
          ctest --test-dir build-renderer-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Renderer tests failed' }

      - name: Set up Python for version-matched assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep every pre-release file under its own install folder.
          $folder = Join-Path $PWD 'windows-package/Diablo Reincarnated v0.2'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null

          $exe = Join-Path $PWD 'build-win64\Release\Diablo Reincarnated.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected 64-bit executable missing: $exe"
          }
          Copy-Item -LiteralPath $exe -Destination (Join-Path $folder 'Diablo Reincarnated.exe')
          $binary = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $machine = [BitConverter]::ToUInt16($binary, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Build is not AMD64: PE machine 0x{0:X4}" -f $machine)
          }

          # Static vcpkg dependencies are preferred; copy any generated DLLs
          # in the executable directory for compatibility.
          Get-ChildItem -LiteralPath (Split-Path $exe) -Filter '*.dll' -File |
            Copy-Item -Destination $folder

          Copy-Item -LiteralPath 'LICENSE.md' -Destination $folder
          @'
          Diablo Reincarnated v0.2 - Windows 11 x64 PRE-RELEASE

          1. Extract the ZIP: it contains a "Diablo Reincarnated v0.2" folder.
          2. Keep that folder separate from your existing DevilutionX installation.
          3. Copy DIABDAT.MPQ from a legally owned Diablo installation beside
             "Diablo Reincarnated.exe" in the new folder.
          4. Run "Diablo Reincarnated.exe" and start a Warrior.
          5. Press F10 to toggle Classic / experimental HD mode.
          6. hd/players/0.png is a deliberately simple synthetic test sprite,
             NOT detailed remastered art or Blizzard artwork.

          This build uses separate Windows settings and save paths, so your
          existing DevilutionX settings and saves are not overwritten.
          This build includes its own d1reincarnated.mpq generated from the
          exact open-source engine assets used for this build. It is NOT the
          original Diablo game data. Keep it beside the new executable.
          Do NOT replace any files in your existing DevilutionX installation.
          Hellfire is not included. HD draw order and lighting are unfinished.

          Project: https://github.com/KillerInc/Diablo-Resurrected
          '@ | Set-Content -Path (Join-Path $folder 'README-Windows.txt') -Encoding utf8

          # Match the resources to this exact engine source revision.
          # The supplemental devilutionx-assets release lacks ASSETS_VERSION
          # and causes the game to fail at startup when repackaged alone.
          $mpq = Join-Path $folder 'd1reincarnated.mpq'
          python tools/create_support_mpq.py --assets 'build-win64/assets' --output $mpq
          if ($LASTEXITCODE -ne 0) { throw 'Building and verifying support MPQ failed' }
          if ((Get-Item $mpq).Length -lt 4096) { throw 'Support MPQ is too small' }

      - name: Generate non-Blizzard HD test sprite
        shell: pwsh
        run: |
          python tools/generate_hd_test_pack.py --out 'windows-package/Diablo Reincarnated v0.2'
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic Warrior generation failed' }
          if (-not (Test-Path 'windows-package/Diablo Reincarnated v0.2/hd/players/0.png')) {
            throw 'Warrior placeholder was not generated'
          }

      # GitHub automatically serves downloadable artifacts as .zip files.
      # The downloaded filename is exactly "Diablo Reincarnated v0.2.zip".
      - name: Upload Diablo Reincarnated v0.2.zip
        uses: actions/upload-artifact@v4
        with:
          name: Diablo Reincarnated v0.2
          path: windows-package/
          if-no-files-found: error
          retention-days: 30

