name: HD renderer Linux build
on:
  push:
    branches: [feature/f10-hd-renderer]
    paths:
      - "Source/**"
      - ".github/workflows/hd-renderer-build.yml"
  pull_request:
    paths:
      - "Source/**"
      - ".github/workflows/hd-renderer-build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libsdl2-dev libsodium-dev libpng-dev libbz2-dev libsdl2-image-dev
      - name: Configure
        run: cmake -S . -B build-hd -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF -DDISABLE_ZERO_TIER=ON -DBUILD_ASSETS_MPQ=OFF
      - name: Build game
        run: cmake --build build-hd --parallel 4
      - name: Verify renderer foundation
        run: |
          cmake -S Source/reincarnated -B build-foundation
          cmake --build build-foundation --parallel 2
          ctest --test-dir build-foundation --output-on-failure
