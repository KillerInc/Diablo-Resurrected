name: Import DevilutionX upstream

# One-shot integration, retriggered when this workflow is revised.
on:
  push:
    branches: [feature/import-devilutionx]
    paths: [.github/workflows/import-devilutionx.yml]
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import pinned DevilutionX and preserve its source
        env:
          UPSTREAM_SHA: a927236209828a1f1dcb7ef32bdd03a288710c29
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_SHA="$(git rev-parse HEAD)"
          git remote add upstream https://github.com/diasurgical/DevilutionX.git
          git fetch --no-tags upstream master
          git cat-file -e "${UPSTREAM_SHA}^{commit}"

          # GitHub App tokens cannot push newly imported upstream workflow files.
          # Retain our project's own workflows but remove incoming upstream workflows.
          git merge --allow-unrelated-histories --no-commit -X ours "$UPSTREAM_SHA"
          git ls-tree -r --name-only "$UPSTREAM_SHA" -- .github/workflows | while IFS= read -r path; do
            if git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
              git restore --source="$BASE_SHA" --staged --worktree -- "$path"
            else
              git rm -f -- "$path"
            fi
          done
          git commit -m "Import pinned DevilutionX source (exclude upstream CI workflows)"

          test -f LICENSE.md
          test -f CMakeLists.txt
          test -f Source/engine/render/scrollrt.cpp
          test -f Source/reincarnated/renderer_switch.cpp
          grep -q "Sustainable Use License" LICENSE.md

          if git push origin HEAD:feature/import-devilutionx; then
            echo 'Imported with upstream Git history preserved.'
            exit 0
          fi

          # Some GitHub App tokens reject upstream history that includes workflow
          # modifications, even when the resulting branch tree excludes the files.
          # In that case preserve the exact source snapshot and pin the commit SHA.
          echo 'History-based push refused; importing pinned tree as a snapshot.'
          git reset --soft "$BASE_SHA"
          git commit -m "Vendor DevilutionX source snapshot at ${UPSTREAM_SHA} (upstream workflows excluded)"
          git push origin HEAD:feature/import-devilutionx
